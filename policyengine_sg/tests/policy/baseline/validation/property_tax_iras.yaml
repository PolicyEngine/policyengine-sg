# Property Tax — IRAS Property Tax Calculator
#
# Source: IRAS Property Tax Calculator
# URL: https://www.iras.gov.sg/taxes/property-tax/property-owners/check-and-pay-property-tax/property-tax-calculator
# Access date: March 2025
#
# Owner-occupied (OO) rates from 1 Jan 2024:
#   First $12,000 AV @ 0%, next $18,000 @ 4%, next $10,000 @ 5%,
#   next $15,000 @ 6%, next $15,000 @ 7%, above $70,000 @ 10%
#
# Non-owner-occupied (non-OO) rates from 1 Jan 2024:
#   First $30,000 AV @ 12%, next $15,000 @ 20%, above $45,000 @ 28%

- name: "Property tax 1: owner-occupied HDB, AV $12,000 — zero bracket"
  # AV entirely within the 0% band
  absolute_error_margin: 0.5
  period: 2025
  input:
    people:
      person1:
        age: 40
    households:
      hh:
        members:
          - person1
        property_annual_value: 12_000
        is_owner_occupied: true
  output:
    property_tax: 0

- name: "Property tax 2: owner-occupied, AV $20,000"
  # 12K @ 0% + 8K @ 4% = 320
  absolute_error_margin: 0.5
  period: 2025
  input:
    people:
      person1:
        age: 40
    households:
      hh:
        members:
          - person1
        property_annual_value: 20_000
        is_owner_occupied: true
  output:
    property_tax: 320

- name: "Property tax 3: owner-occupied, AV $30,000"
  # 12K @ 0% + 18K @ 4% = 720
  absolute_error_margin: 0.5
  period: 2025
  input:
    people:
      person1:
        age: 40
    households:
      hh:
        members:
          - person1
        property_annual_value: 30_000
        is_owner_occupied: true
  output:
    property_tax: 720

- name: "Property tax 4: owner-occupied, AV $50,000"
  # 12K @ 0% + 18K @ 4% + 20K @ 5% = 0 + 720 + 1,000 = 1,720
  absolute_error_margin: 0.5
  period: 2025
  input:
    people:
      person1:
        age: 40
    households:
      hh:
        members:
          - person1
        property_annual_value: 50_000
        is_owner_occupied: true
  output:
    property_tax: 1_720

- name: "Property tax 5: non-owner-occupied, AV $30,000"
  # 30K @ 12% = 3,600
  absolute_error_margin: 0.5
  period: 2025
  input:
    people:
      person1:
        age: 40
    households:
      hh:
        members:
          - person1
        property_annual_value: 30_000
        is_owner_occupied: false
  output:
    property_tax: 3_600

- name: "Property tax 6: non-owner-occupied, AV $50,000"
  # 30K @ 12% + 15K @ 20% + 5K @ 28% = 3,600 + 3,000 + 1,400 = 8,000
  absolute_error_margin: 0.5
  period: 2025
  input:
    people:
      person1:
        age: 40
    households:
      hh:
        members:
          - person1
        property_annual_value: 50_000
        is_owner_occupied: false
  output:
    property_tax: 8_000
