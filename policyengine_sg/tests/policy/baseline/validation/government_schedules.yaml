# Government-Published Schedule Validations
#
# Each test cites a specific government agency and published table.
# These test individual programs against their authoritative source
# rather than testing program interactions.

# ------------------------------------------------------------------
# Silver Support Scheme — CPF Board
# Source: https://www.cpf.gov.sg/member/faq/retirement-income/silver-support-scheme
# Access date: March 2025
# Quarterly payouts (4 per year):
#   1-2 room: $1,080/quarter (lower PCI) / $730/quarter (higher PCI)
#   3-room:   $860/quarter / $540/quarter
#   4-room:   $650/quarter / $360/quarter
#   5-room+:  not eligible
# ------------------------------------------------------------------

- name: "Silver Support 1: age 70, 1-room HDB, low PCI — $4,320/year"
  # Source: CPF Board Silver Support payout table
  # 1-room, lower PCI tier: $1,080/quarter * 4 = $4,320
  absolute_error_margin: 0.5
  period: 2025
  input:
    people:
      person1:
        age: 70
        is_citizen: true
        employment_income: 0
        number_of_properties: 1
    households:
      hh:
        members:
          - person1
        hdb_flat_type: ONE_ROOM
        property_annual_value: 3_000
  output:
    silver_support_eligible: true
    silver_support_amount: 4_320

- name: "Silver Support 2: age 70, 4-room HDB — $2,600/year"
  # Source: CPF Board Silver Support payout table
  # 4-room, standard tier: $650/quarter * 4 = $2,600
  absolute_error_margin: 0.5
  period: 2025
  input:
    people:
      person1:
        age: 70
        is_citizen: true
        employment_income: 0
        number_of_properties: 1
    households:
      hh:
        members:
          - person1
        hdb_flat_type: FOUR_ROOM
        property_annual_value: 10_000
  output:
    silver_support_eligible: true
    silver_support_amount: 2_600

