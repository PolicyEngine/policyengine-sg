- name: Citizen third and subsequent property.
  absolute_error_margin: 0.1
  period: 2025
  input:
    people:
      person1:
        age: 45
    households:
      hh:
        members:
          - person1
        property_purchase_price: 1_000_000
        buyer_profile: CITIZEN_THIRD_AND_SUBSEQUENT
  output:
    # ABSD citizen 3rd+ = 30%
    # 1,000,000 * 30% = 300,000
    additional_buyers_stamp_duty: 300_000

