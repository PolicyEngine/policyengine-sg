- name: CPF at exact age boundary 55 (still in below-55 band).
  absolute_error_margin: 0.1
  period: 2025
  input:
    people:
      person1:
        age: 55
        employment_income: 60_000
        is_citizen: true
  output:
    # Age 55 => age_55_and_below band
    # Employee: 60,000 * 20% = 12,000
    # Employer: 60,000 * 17% = 10,200
    cpf_employee_contribution: 12_000
    cpf_employer_contribution: 10_200

